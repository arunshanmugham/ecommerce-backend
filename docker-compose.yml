# Optional: a throwaway MySQL if you don't want to use an existing local install.
# Uses port 3307 to avoid clashing with a MySQL already on 3306; run the app with DB_PORT=3307.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
